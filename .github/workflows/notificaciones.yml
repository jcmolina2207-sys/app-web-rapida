name: Notificaciones de pedidos

on:
  schedule:
    # Cada 10 minutos. OJO con el límite gratis de minutos si el repo
    # es PRIVADO (ver nota de "minutos gratis" en SETUP.md). Si tenés
    # el repo privado y querés ir 100% seguro dentro del free tier,
    # cambiá esto a "*/30 * * * *".
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # permite ejecutarlo a mano desde la pestaña "Actions" para probar

jobs:
  enviar-notificaciones:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: scripts
        run: npm install

      - name: Ejecutar chequeo de notificaciones
        working-directory: scripts
        run: node send-notifications.js
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
