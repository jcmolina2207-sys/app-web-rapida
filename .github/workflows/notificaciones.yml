name: Notificaciones Toque Artesano

on:
  schedule:
    # Corre cada 10 minutos, todo el día, todos los días.
    # Argentina no tiene horario de verano, así que el offset UTC-3
    # es fijo todo el año — no hace falta ajustar esto nunca.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # permite disparar manualmente desde la pestaña Actions, para probar

jobs:
  enviar-notificaciones:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install firebase-admin

      - name: Ejecutar script de notificaciones
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/send-notifications.js
